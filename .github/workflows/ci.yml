name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=test-results/unit.xml

      - name: Unit test summary
        if: always()
        shell: bash
        run: |
          if [ -f test-results/unit.xml ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("test-results/unit.xml").getroot()
          tests = int(root.get("tests", "0"))
          failures = int(root.get("failures", "0"))
          errors = int(root.get("errors", "0"))
          skipped = sum(int(s.get("skipped", "0")) for s in root.findall("testsuite"))
          print(f"### Unit tests\n\n{tests - failures - errors - skipped} passed, {failures + errors} failed, {skipped} skipped")
          PY
          else
            echo "### Unit test report unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: docs/coverage/
          if-no-files-found: ignore
  e2e-tests:
    needs: lint-and-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Run E2E in containers
        run: docker compose -f compose.test.yaml --profile e2e up e2e --abort-on-container-exit --exit-code-from e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up test containers
        if: always()
        run: docker compose -f compose.test.yaml --profile e2e down -v --remove-orphans
  performance:
    needs: lint-and-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run local performance test
        shell: bash
        env:
          BASE_URL: http://127.0.0.1:3000
          RUN_ID: ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          LAB07_TEST_MODE=true npm run dev -- --hostname 127.0.0.1 > "$RUNNER_TEMP/lab07-next.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..60}; do
            if curl -fsS "$BASE_URL/api/health" > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Local app did not become ready"
            exit 1
          fi

          k6 run --summary-export=performance/results.json performance/load-test.js

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-results-${{ github.sha }}
          path: performance/results.json
          if-no-files-found: warn
  production-approval:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-unit-test, e2e-tests]
    runs-on: ubuntu-latest
    environment:
      name: Production
      deployment: false
    steps:
      - name: Mark production approval complete
        run: echo "Approved for production promotion"