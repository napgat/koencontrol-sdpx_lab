openapi: 3.1.0
info:
  title: PairEval API
  version: 1.0.0
  license:
    name: UNLICENSED
    identifier: LicenseRef-UNLICENSED
  description: REST API for the PairEval group-evaluation MVP.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /assignments:
    post:
      operationId: createAssignment
      summary: Create a group-evaluation assignment
      x-user-story: US-01
      description: Instructor-only. The server validates that the deadline is future-dated and criterion weights total exactly 100%.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
            examples:
              validAssignment:
                value:
                  classroomId: 148fd37f-fba9-4e6c-b1bd-7d32e94aeaa1
                  title: Group evaluation 1
                  deadlineAt: '2026-10-15T23:59:00+07:00'
                  criteria:
                    - name: User experience
                      weightPercent: 60
                    - name: Completeness
                      weightPercent: 40
      responses:
        '201':
          description: Assignment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /assignments/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      operationId: getAssignmentReadiness
      summary: Get assignment details and readiness
      x-user-story: US-08
      description: Instructor-only. The authenticated instructor must belong to the assignment classroom.
      responses:
        '200':
          description: Assignment details and pair-generation readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentReadiness'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /assignments/{assignmentId}/pair-assignments/generate:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    post:
      operationId: generatePairAssignments
      summary: Generate and assign evaluation pairs
      x-user-story: US-02
      description: Instructor-only. The server creates pairs per criterion and never assigns a student a pair containing that student's own group.
      responses:
        '201':
          description: Pair assignments generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairGenerationResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /assignments/{assignmentId}/my-pairs:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      operationId: getMyAssignedPairs
      summary: Get the authenticated student's assigned pairs
      x-user-story: US-03
      description: Student-only. Returns only pairs assigned to the bearer-token subject, grouped by criterion; it never exposes another student's pairs.
      responses:
        '200':
          description: Assigned pairs, criteria, deadline, and saved draft answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPairsResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /pair-assignments/{pairAssignmentId}/response:
    parameters:
      - $ref: '#/components/parameters/PairAssignmentId'
    put:
      operationId: saveDraftResponse
      summary: Save or update a draft response
      x-user-story: US-04
      description: Student-only. The pair must be assigned to the authenticated student; incomplete drafts are permitted. Submitted responses cannot be edited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftRequest'
      responses:
        '200':
          description: Draft saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /assignments/{assignmentId}/submit:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    post:
      operationId: submitEvaluation
      summary: Submit the authenticated student's evaluation
      x-user-story: US-05
      description: Student-only. The server checks the deadline. Partial submissions are accepted only when confirmIncomplete is true; the server returns completion progress otherwise. Submitted answers are immutable in this MVP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitEvaluationRequest'
            examples:
              confirmPartialSubmission:
                value:
                  confirmIncomplete: true
      responses:
        '201':
          description: Evaluation submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatus'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Deadline has passed or an incomplete submission requires confirmation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                confirmationRequired:
                  value:
                    code: INCOMPLETE_SUBMISSION_CONFIRMATION_REQUIRED
                    message: 6 of 10 assigned pairs are answered; set confirmIncomplete to true to submit.
                    status: 422
                    details:
                      answeredPairs: 6
                      totalAssignedPairs: 10
  /assignments/{assignmentId}/my-submission:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      operationId: getMySubmissionStatus
      summary: Get the authenticated student's submission status
      x-user-story: US-06
      description: Student-only. Returns only the bearer-token subject's status, never another student's status.
      responses:
        '200':
          description: The student's Not Started, Draft, or Submitted state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /assignments/{assignmentId}/report:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      operationId: getAssignmentReport
      summary: Get assignment score and coverage report
      x-user-story: US-07
      description: Instructor-only. The authenticated instructor must belong to the assignment classroom.
      responses:
        '200':
          description: Group scores by criterion plus submission and pair-coverage summaries; arrays may be empty when there are no submissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentReport'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PairAssignmentId:
      name: pairAssignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Malformed request.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing, invalid, or expired bearer token.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated user lacks the required role or classroom access.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Requested resource does not exist or is not visible to the caller.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Request conflicts with the current resource state.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Request violates a business or validation rule.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [code, message, status]
      properties:
        code: { type: string, example: CRITERIA_WEIGHT_TOTAL_INVALID }
        message: { type: string, example: Criteria weights must total exactly 100%. }
        status: { type: integer, minimum: 400, maximum: 599, example: 422 }
        details: { type: object, additionalProperties: true }
    CriterionInput:
      type: object
      required: [name, weightPercent]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        weightPercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
    Criterion:
      allOf:
        - $ref: '#/components/schemas/CriterionInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    CreateAssignmentRequest:
      type: object
      required: [classroomId, title, deadlineAt, criteria]
      properties:
        classroomId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        deadlineAt: { type: string, format: date-time, description: Offset-aware deadline; must be in the future. }
        criteria:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CriterionInput' }
          description: The server requires the weights to total exactly 100%.
    Assignment:
      type: object
      required: [id, classroomId, title, deadlineAt, criteria, readiness]
      properties:
        id: { type: string, format: uuid }
        classroomId: { type: string, format: uuid }
        title: { type: string }
        deadlineAt: { type: string, format: date-time }
        criteria: { type: array, items: { $ref: '#/components/schemas/Criterion' } }
        readiness: { type: string, enum: [Not Ready, Ready] }
    AssignmentReadiness:
      allOf:
        - $ref: '#/components/schemas/Assignment'
        - type: object
          required: [pairAssignmentCount]
          properties:
            pairAssignmentCount: { type: integer, minimum: 0 }
    PairGenerationResult:
      type: object
      required: [assignmentId, readiness, pairAssignmentCount, generatedAt]
      properties:
        assignmentId: { type: string, format: uuid }
        readiness: { type: string, enum: [Ready] }
        pairAssignmentCount: { type: integer, minimum: 1 }
        generatedAt: { type: string, format: date-time }
    Group:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Pair:
      type: object
      required: [id, leftGroup, rightGroup, draftScore]
      properties:
        id: { type: string, format: uuid }
        leftGroup: { $ref: '#/components/schemas/Group' }
        rightGroup: { $ref: '#/components/schemas/Group' }
        draftScore: { type: [integer, 'null'], minimum: 1, maximum: 5 }
    CriterionPairs:
      type: object
      required: [criterion, pairs]
      properties:
        criterion: { $ref: '#/components/schemas/Criterion' }
        pairs: { type: array, items: { $ref: '#/components/schemas/Pair' } }
    MyPairsResponse:
      type: object
      required: [assignmentId, deadlineAt, status, criteria]
      properties:
        assignmentId: { type: string, format: uuid }
        deadlineAt: { type: string, format: date-time }
        status: { type: string, enum: [Not Started, Draft, Submitted] }
        criteria: { type: array, items: { $ref: '#/components/schemas/CriterionPairs' } }
    SaveDraftRequest:
      type: object
      required: [score]
      properties:
        score: { type: integer, minimum: 1, maximum: 5 }
    EvaluationResponse:
      type: object
      required: [pairAssignmentId, score, status, savedAt]
      properties:
        pairAssignmentId: { type: string, format: uuid }
        score: { type: integer, minimum: 1, maximum: 5 }
        status: { type: string, enum: [Draft] }
        savedAt: { type: string, format: date-time }
    SubmitEvaluationRequest:
      type: object
      required: [confirmIncomplete]
      properties:
        confirmIncomplete:
          type: boolean
          description: Must be true when not every assigned pair has an answer.
    SubmissionStatus:
      type: object
      required: [assignmentId, status, answeredPairs, totalAssignedPairs]
      properties:
        assignmentId: { type: string, format: uuid }
        status: { type: string, enum: [Not Started, Draft, Submitted] }
        submittedAt: { type: [string, 'null'], format: date-time }
        answeredPairs: { type: integer, minimum: 0 }
        totalAssignedPairs: { type: integer, minimum: 0 }
    GroupCriterionScore:
      type: object
      required: [criterion, score]
      properties:
        criterion: { $ref: '#/components/schemas/Criterion' }
        score: { type: number }
    GroupScoreSummary:
      type: object
      required: [group, criterionScores]
      properties:
        group: { $ref: '#/components/schemas/Group' }
        criterionScores: { type: array, items: { $ref: '#/components/schemas/GroupCriterionScore' } }
    PairCoverage:
      type: object
      required: [criterionId, leftGroupId, rightGroupId, evaluationCount]
      properties:
        criterionId: { type: string, format: uuid }
        leftGroupId: { type: string, format: uuid }
        rightGroupId: { type: string, format: uuid }
        evaluationCount: { type: integer, minimum: 0 }
    AssignmentReport:
      type: object
      required: [assignmentId, submissionCount, eligibleStudentCount, groupScores, pairCoverage]
      properties:
        assignmentId: { type: string, format: uuid }
        submissionCount: { type: integer, minimum: 0 }
        eligibleStudentCount: { type: integer, minimum: 0 }
        groupScores: { type: array, items: { $ref: '#/components/schemas/GroupScoreSummary' } }
        pairCoverage: { type: array, items: { $ref: '#/components/schemas/PairCoverage' } }
