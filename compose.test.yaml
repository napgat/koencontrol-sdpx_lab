services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  unit:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgres://testuser:testpass@test-db:5432/testdb
      NODE_ENV: test
    depends_on:
      test-db:
        condition: service_healthy
    command: npm test

  app-test:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgres://testuser:testpass@test-db:5432/testdb
      NODE_ENV: test
      E2E_TEST_MODE: "true"
    depends_on:
      test-db:
        condition: service_healthy
    command: npm start
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /work
    volumes:
      - .:/work
      - e2e_node_modules:/work/node_modules
    environment:
      DATABASE_URL: postgres://testuser:testpass@test-db:5432/testdb
      BASE_URL: http://app-test:3000
      NODE_ENV: test
      CI: "true"
    depends_on:
      test-db:
        condition: service_healthy
      app-test:
        condition: service_healthy
    command: sh -c "npm ci && npx playwright test"
    profiles: ["e2e"]

volumes:
  e2e_node_modules: